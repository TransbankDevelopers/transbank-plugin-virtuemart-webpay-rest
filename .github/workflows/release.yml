name: Release
on:
  release:
    types: [created]
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "7.3"
      - name: Install SDK dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x config.sh
          ./config.sh
      - name: Package
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x package.sh
          ./package.sh
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Upload plugin zip to release
        run: |
          gh release upload "$RELEASE_TAG" \
            "plugin-transbank-webpay-virtuemart3-rest-${RELEASE_TAG}.zip" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
