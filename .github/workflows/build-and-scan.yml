name: Build and Scan
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "master"

permissions:
  contents: read

jobs:
  build:
    name: Build and Scan
    runs-on: ubuntu-latest
    outputs:
      artifact_url: ${{ steps.artifact_upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "7.3"
      - name: Package Plugin
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x config.sh package.sh
          ./config.sh
          ./package.sh
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload build artifact
        id: artifact_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plugin-transbank-webpay-virtuemart3-rest.zip
          path: ./plugin-transbank-webpay-virtuemart3-rest-1.0.0.zip
          if-no-files-found: error
          retention-days: 7

  comment:
    name: Comment artifact link on PR
    needs: build
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: transbankdevelopers/transbank-github-actions-templates/.github/workflows/plugin-pr-artifact.yml@f104ee093bb1edab2594a19a51bc8be5c201bc2e
    with:
      pr_number: ${{ github.event.pull_request.number }}
      source_repo_full_name: ${{ github.event.pull_request.head.repo.full_name }}
      artifact_url: ${{ needs.build.outputs.artifact_url }}
      artifact_name: plugin-transbank-webpay-virtuemart3-rest.zip
      comment_marker: "<!-- transbank-webpay-rest-virtuemart-artifact -->"
      comment_prefix: Plugin Zip
